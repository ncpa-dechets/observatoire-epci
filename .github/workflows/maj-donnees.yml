# Récupère les données nationales, régénère les CSV, contrôle, et enregistre si quelque chose a changé.
name: Mise à jour des données

on:
  schedule:
    - cron: "0 5 3 * *"        # le 3 de chaque mois à 5 h UTC
  workflow_dispatch:            # bouton « Run workflow » dans l'onglet Actions

permissions:
  contents: write               # nécessaire pour enregistrer les données mises à jour

concurrency:
  group: maj-donnees
  cancel-in-progress: false

jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Dépendances
        run: pip install -r scripts/requirements.txt

      - name: Référentiel des EPCI (Etalab)
        run: python scripts/fetch_epci.py

      - name: Base du comparateur de territoires (INSEE)
        # Non bloquant tant que le script n'a pas été validé sur le fichier réel :
        # retirer continue-on-error une fois la phase 1 de la feuille de route terminée.
        continue-on-error: true
        run: python scripts/fetch_insee.py

      - name: Données communales (classeur de saisie)
        run: python scripts/build_data.py

      - name: Contrôles de cohérence
        run: python scripts/check_data.py

      - name: Enregistrer si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/processed
          if git diff --cached --quiet; then
            echo "Aucune donnée modifiée."
          else
            git commit -m "Données : mise à jour automatique du $(date -u +%Y-%m-%d)"
            git push
          fi
